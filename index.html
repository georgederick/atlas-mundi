<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas Mundial</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/effects.css">
</head>
<body>
<header>
  <button id="tg" class="btn" aria-label="Lista de países">☰ Países</button>
  <a class="logo" href="#/">🧭 Atlas Mundial</a>
  <div id="crumbs"></div>
  <button class="btn" id="br" title="Ranking">🏆<span class="t"> Ranking</span></button>
  <button class="btn" id="bt" title="Alternar tema">🌙</button>
  <button class="btn" id="bg" title="Globo 3D">🌐<span class="t"> Globo 3D</span></button>
  <button class="btn" id="bc" title="Comparar países">⚖️<span class="t"> Comparar</span></button>
  <button class="btn" id="bq" title="Quiz">🎯<span class="t"> Quiz</span></button>
  <a class="btn" href="#/" title="Mapa-múndi">🌍<span class="t"> Mapa-múndi</span></a>
</header>
<main>
  <aside id="side">
    <div class="tools">
      <input id="q" type="search" placeholder="🔍 Buscar país (ex.: Japão, France, BRA)" autocomplete="off">
      <select id="mm"><option value="">Mapa: cores por continente</option><option value="population">Mapa: população</option><option value="area">Mapa: área territorial</option><option value="dens">Mapa: densidade demográfica</option></select>
      <select id="fc"><option value="">Todos os continentes</option></select>
      <label><input type="checkbox" id="ff"> Mostrar só favoritos</label>
    </div>
    <div id="count"></div>
    <ul id="list"></ul>
  </aside>
  <div id="map"></div>
  <div class="hint" id="hint"></div>
  <div id="page"></div>
  <div id="boot"><div class="sp"></div><div id="bm">Carregando mapas e dados dos países…</div></div>
</main>
<section id="intro"><canvas id="gl"></canvas><div class="grain"></div><div id="gtip"></div>
  <div class="it"><p class="ey">ATLAS GEOGRÁFICO DIGITAL</p><h1>Atlas Mundial</h1><p>Mapas, culturas, história e dados reais de mais de 240 países e territórios.</p><button id="go" class="cta">Explorar o atlas →</button><small>Arraste para girar • clique em um país</small></div></section>
<div id="lg" class="hint" style="left:12px;transform:none;display:none;top:70px;bottom:auto;border-radius:10px"></div>
<div id="ov" class="modal"><div class="wrap"><button class="btn" id="cl">✕ Fechar</button><div id="ovc" style="margin-top:16px"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/app.js"></script>
<script src="js/globe.js"></script>
<script src="js/media.js"></script>
<script src="js/extras.js"></script>
</body>
</html>
