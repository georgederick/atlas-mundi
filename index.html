<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas Mundial</title>
<meta name="description" content="Explore o mundo continente por continente e descubra dados de cada país.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stars"></div>
<header><img class="logo" src="assets/logo.svg" alt="Atlas Mundial"></header>
<button id="back" class="pill" hidden><i class="bi bi-arrow-left"></i><span>Voltar</span></button>
<div id="search" class="pill"><i class="bi bi-search"></i><input id="q" placeholder="Buscar país" autocomplete="off" aria-label="Buscar país"><div id="res"></div></div>
<div id="crumb"></div>
<svg id="map" role="img" aria-label="Globo interativo"></svg>
<div id="tip"></div>
<div id="hint"></div>
<aside id="panel" aria-live="polite"></aside>
<div id="load"><div class="ring"></div><p id="lmsg">Carregando o mundo</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
